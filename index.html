<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Equipo Marketing — Umbro Uruguay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#E8001D; --ink:#141414; --paper:#FAFAF8; --line:#E3E1DA; --muted:#726F68;
    --cuanti:#2452A8; --cuanti-bg:#E4ECF9; --cuali:#C25A12; --cuali-bg:#FBEADC; --white:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;}
  .mono{font-family:'Roboto Mono',monospace;}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);position:relative;overflow:hidden;}
  #login::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 120px);}
  .login-card{position:relative;width:380px;background:var(--paper);padding:44px 40px 36px;border-top:6px solid var(--red);}
  .login-card .kicker{color:var(--red);font-weight:700;font-size:13px;letter-spacing:.14em;margin-bottom:2px;}
  .login-card h1{font-size:34px;line-height:.95;margin:0 0 26px;font-weight:800;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--white);font-family:'Inter';font-size:14px;}
  .field input:focus{outline:2px solid var(--red);outline-offset:1px;border-color:var(--red);}
  .btn{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:6px;}
  .btn:hover{background:var(--red);}
  .btn:disabled{opacity:.5;cursor:default;}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
  .demo-note{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.5;}

  #app{display:none;min-height:100vh;}
  .topbar{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:60px;}
  .topbar .brand{font-family:'Barlow Condensed';font-weight:800;font-size:20px;letter-spacing:.03em;}
  .topbar .brand span{color:var(--red);}
  .topbar .who{display:flex;align-items:center;gap:14px;font-size:13px;color:#cfcfcf;}
  .topbar .who b{color:#fff;}
  .logout{background:none;border:1px solid #444;color:#cfcfcf;font-size:12px;padding:6px 12px;cursor:pointer;font-family:'Inter';}
  .logout:hover{border-color:var(--red);color:#fff;}
  .pwd-toggle{background:none;border:1px solid #444;color:#cfcfcf;font-size:12px;padding:6px 12px;cursor:pointer;font-family:'Inter';}
  .pwd-toggle:hover{border-color:#fff;color:#fff;}
  .pwd-panel{position:absolute;top:60px;right:28px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);padding:18px;width:260px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:none;z-index:10;}
  .pwd-panel.open{display:block;}
  .pwd-panel .field{margin-bottom:12px;}
  .pwd-panel .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .pwd-panel input{width:100%;padding:8px 9px;border:1px solid var(--line);font-family:'Inter';font-size:13px;}
  .pwd-panel .btn{margin-top:4px;padding:9px;font-size:13px;}
  .pwd-msg{font-size:11.5px;margin-top:8px;min-height:14px;}
  .pwd-msg.ok{color:#1F7A3D;}
  .pwd-msg.err{color:var(--red);}

  .layout{display:flex;max-width:1240px;margin:0 auto;}
  .sidebar{width:230px;flex-shrink:0;padding:26px 18px;border-right:1px solid var(--line);min-height:calc(100vh - 60px);}
  .sidebar .label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.1em;margin-bottom:10px;font-weight:600;}
  .nav-item{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 10px;font-family:'Inter';font-size:13.5px;color:var(--ink);cursor:pointer;border-left:3px solid transparent;margin-bottom:2px;}
  .nav-item.active{border-left-color:var(--red);color:var(--red);font-weight:600;background:var(--cuanti-bg);}
  .nav-item:hover:not(.active){background:#F2F1EC;}

  .main{flex:1;padding:30px 32px 60px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;border-bottom:2px solid var(--ink);padding-bottom:14px;}
  .page-head h1{font-size:30px;margin:0;font-weight:800;}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .period{font-size:12px;color:var(--muted);}
  .period b{color:var(--ink);}

  .filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .filters select{font-family:'Inter';font-size:12.5px;padding:7px 10px;border:1px solid var(--line);background:#fff;}

  .section-title{font-size:20px;margin:6px 0 14px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .section-title .num{color:var(--red);}

  table{width:100%;border-collapse:collapse;background:#fff;margin-bottom:30px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--ink);padding:8px 10px;}
  td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#F7F6F2;}
  .pill{display:inline-block;font-size:10.5px;padding:2px 8px;font-weight:600;}
  .pill.cuanti{background:var(--cuanti-bg);color:var(--cuanti);}
  .pill.cuali{background:var(--cuali-bg);color:var(--cuali);}
  .tagmini{font-size:10.5px;color:var(--muted);}

  .valinput{width:90px;padding:5px 7px;border:1px solid var(--line);font-family:'Roboto Mono';font-size:12.5px;}
  .savebtn{font-family:'Inter';font-size:11px;padding:5px 10px;border:1px solid var(--ink);background:#fff;cursor:pointer;margin-left:6px;}
  .savebtn:hover{background:var(--ink);color:#fff;}
  .savebtn.saved{background:#1F7A3D;border-color:#1F7A3D;color:#fff;}

  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:30px;}
  .person-card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--ink);padding:18px;cursor:pointer;}
  .person-card:hover{border-top-color:var(--red);}
  .person-card .role{font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;margin-bottom:2px;}
  .person-card .name{font-family:'Barlow Condensed';font-weight:800;font-size:22px;}
  .empty{color:var(--muted);font-size:12.5px;padding:20px 0;}
  .loading{padding:40px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="kicker">DACRIMAR SA — UMBRO URUGUAY</div>
    <h1>Panel de<br>Marketing</h1>
    <div class="field"><label>Email</label><input id="email-input" type="email" placeholder="nombre@dacrimar.com"></div>
    <div class="field"><label>Contraseña</label><input id="pass-input" type="password" placeholder="••••••••••"></div>
    <button class="btn" id="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="err" id="login-err"></div>
    <div class="demo-note">Conectado a Supabase — login real. Los usuarios se dan de alta desde Authentication &gt; Users.</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">DACRIMAR <span>MKT</span></div>
    <div class="who"><span id="who-role"></span><b id="who-name"></b>
      <button class="pwd-toggle" onclick="togglePwdPanel()">Cambiar contraseña</button>
      <button class="logout" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="pwd-panel" id="pwd-panel">
    <div class="field"><label>Nueva contraseña</label><input id="pwd-new" type="password" placeholder="Mínimo 6 caracteres"></div>
    <div class="field"><label>Repetir contraseña</label><input id="pwd-confirm" type="password"></div>
    <button class="btn" onclick="changePassword()">Guardar contraseña</button>
    <div class="pwd-msg" id="pwd-msg"></div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main"><div class="loading">Cargando…</div></div>
  </div>
</div>

<script>
// ====== CONFIGURACIÓN DE SUPABASE ======
const SUPABASE_URL = "https://hzuwwzcqzyfmvavqexaf.supabase.co";
const SUPABASE_KEY = "sb_publishable_GNXlIsnaMfyRG0xAh0-9Hg_t8eqzjx8";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROL_LABEL = {
  gerencia: "Gerencia de Marketing",
  coordinacion: "Coordinación de Marketing",
  social_media: "Social Media Manager",
  diseno: "Diseñadora Junior",
  direccion: "Dirección"
};
const ES_DIRECTIVO = r => r === 'gerencia' || r === 'direccion';

let myProfile = null;      // perfil logueado
let viewingProfile = null; // perfil que se está mirando (puede ser otro, si soy directivo)
let allProfiles = [];
let currentCuanti = [];
let currentViewProfile = null;
let currentPeriodoStr = null;
let currentPuedeCargarCuanti = false;

let pdfJsReady = null;
function loadPdfJs(){
  if(pdfJsReady) return pdfJsReady;
  pdfJsReady = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return pdfJsReady;
}

function getHandles(marca){
  const key = `mc_handles_${marca}`;
  let saved = localStorage.getItem(key);
  if(saved) return JSON.parse(saved);
  const facebook = prompt(`Nombre de la cuenta de FACEBOOK de ${marca} tal como aparece en la portada del PDF de Metricool (ej: "TimeOut"):`);
  const instagram = prompt(`Nombre de la cuenta de INSTAGRAM de ${marca} tal como aparece en la portada (ej: "timeoutuy"):`);
  const tiktok = prompt(`Nombre de la cuenta de TIKTOK de ${marca} tal como aparece en la portada (ej: "Timeoutuy"):`);
  const handles = { facebook: (facebook||'').trim(), instagram: (instagram||'').trim(), tiktok: (tiktok||'').trim() };
  localStorage.setItem(key, JSON.stringify(handles));
  return handles;
}

function extractNumber(segment, label, windowChars){
  windowChars = windowChars || 200;
  const idx = segment.indexOf(label);
  if(idx === -1) return null;
  const chunk = segment.slice(idx + label.length, idx + label.length + windowChars);
  const m = chunk.match(/(-?\d+(?:[.,]\d+)?)\s?(K|M)?/);
  if(!m || m[1] === undefined) return null;
  let val = parseFloat(m[1].replace(',', '.'));
  if(m[2] === 'K') val *= 1000;
  if(m[2] === 'M') val *= 1000000;
  return Math.round(val);
}

function extractRedMetrics(segment, red){
  const engagement = extractNumber(segment, 'Engagement');
  const alcanceTotal = red === 'TikTok' ? extractNumber(segment, 'Reprod.') : extractNumber(segment, 'Visualizaciones');
  let seguidores = extractNumber(segment, 'Balance de');
  if(seguidores === null){
    const adquiridos = extractNumber(segment, 'Adquiridos');
    const perdidos = extractNumber(segment, 'Perdidos');
    if(adquiridos !== null && perdidos !== null) seguidores = adquiridos - perdidos;
  }
  return { alcance: alcanceTotal, engagement, seguidores };
}

async function parsePdfAndBuildCsv(event){
  const file = event.target.files[0];
  const msg = document.getElementById('import-msg');
  if(!file) return;
  const marcaSel = document.getElementById('pdf-marca-select');
  const marca = marcaSel ? marcaSel.value : null;
  if(!marca){ msg.className='pwd-msg err'; msg.textContent='No hay marca seleccionada.'; return; }

  msg.className = 'pwd-msg'; msg.textContent = 'Leyendo PDF…';
  const handles = getHandles(marca);
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let fullText = '';
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    fullText += '\n' + content.items.map(it=>it.str).join('\n');
  }

  const positions = [
    { red: 'Instagram', idx: handles.instagram ? fullText.indexOf(handles.instagram) : -1 },
    { red: 'TikTok', idx: handles.tiktok ? fullText.indexOf(handles.tiktok) : -1 },
    { red: 'Facebook', idx: handles.facebook ? fullText.indexOf(handles.facebook) : -1 },
  ].filter(p => p.idx !== -1).sort((a,b)=>a.idx-b.idx);

  const resultados = {};
  positions.forEach((p, i) => {
    const end = i + 1 < positions.length ? positions[i+1].idx : fullText.length;
    resultados[p.red] = extractRedMetrics(fullText.slice(p.idx, end), p.red);
  });

  const rows = [['id','indicador','marca','red_social','valor']];
  let encontrados = 0;
  currentCuanti.forEach(ind => {
    let valor = '';
    if(ind.marca === marca && ind.red_social && resultados[ind.red_social]){
      const r = resultados[ind.red_social];
      if(ind.nombre.includes('Alcance') && r.alcance !== null){ valor = r.alcance; encontrados++; }
      else if(ind.nombre.includes('Engagement') && r.engagement !== null){ valor = r.engagement; encontrados++; }
      else if(ind.nombre.includes('seguidores') && r.seguidores !== null){ valor = r.seguidores; encontrados++; }
    }
    rows.push([ind.id, ind.nombre, ind.marca||'', ind.red_social||'', valor]);
  });

  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `borrador_${marca.toLowerCase().replace(/\s+/g,'_')}_${currentPeriodoStr}.csv`;
  a.click();
  URL.revokeObjectURL(url);

  msg.className = 'pwd-msg ok';
  msg.textContent = `Se completaron ${encontrados} de ${currentCuanti.filter(i=>i.marca===marca && i.red_social).length} valores de ${marca} automáticamente. Revisá el CSV descargado (los demás campos de otras marcas quedan vacíos) y luego usá "Importar CSV".`;
  event.target.value = '';
}

function csvEscape(v){
  v = (v===null||v===undefined) ? '' : String(v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}

function downloadTemplate(){
  const rows = [['id','indicador','marca','red_social','valor']];
  currentCuanti.forEach(i=>{
    rows.push([i.id, i.nombre, i.marca||'', i.red_social||'', '']);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `plantilla_${currentViewProfile.nombre.toLowerCase()}_${currentPeriodoStr}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.slice(1).map(line=>{
    // parseo simple compatible con el formato de nuestra plantilla (sin comillas complejas)
    const parts = line.split(',');
    return { id: parts[0], indicador: parts[1], marca: parts[2], red_social: parts[3], valor: parts[4] };
  });
}

async function importCSV(event){
  const file = event.target.files[0];
  const msg = document.getElementById('import-msg');
  if(!file) return;
  const text = await file.text();
  const rows = parseCSV(text);
  const validIds = new Set(currentCuanti.map(i=>String(i.id)));
  let importados = 0, ignorados = 0;
  for(const row of rows){
    if(!row.id || !validIds.has(String(row.id)) || row.valor===undefined || row.valor.trim()===''){ ignorados++; continue; }
    const { error } = await sb.from('valores_cuantitativos').upsert({
      indicador_id: Number(row.id), persona_id: currentViewProfile.id, periodo: currentPeriodoStr,
      valor: Number(row.valor), cargado_por: myProfile.id
    }, { onConflict: 'indicador_id,persona_id,periodo' });
    if(!error) importados++; else ignorados++;
  }
  msg.className = 'pwd-msg ok';
  msg.textContent = `${importados} valores importados${ignorados?`, ${ignorados} filas ignoradas (vacías o inválidas)`:''}.`;
  event.target.value = '';
  renderPersona(currentViewProfile);
}

function currentPeriodo(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}

async function doLogin(){
  const email = document.getElementById('email-input').value.trim();
  const password = document.getElementById('pass-input').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Ingresando…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Ingresar';
  if(error){ err.textContent = 'Email o contraseña incorrectos.'; return; }
  await afterLogin(data.user);
}

async function afterLogin(user){
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(error || !profile){
    document.getElementById('login-err').textContent = 'Tu usuario no tiene un perfil vinculado todavía. Avisale a Daniela.';
    await sb.auth.signOut();
    return;
  }
  myProfile = profile;
  viewingProfile = profile;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('who-role').textContent = ROL_LABEL[profile.rol].toUpperCase() + ' — ';
  document.getElementById('who-name').textContent = profile.nombre;

  if(ES_DIRECTIVO(profile.rol)){
    const { data: profs } = await sb.from('profiles').select('*').order('nombre');
    allProfiles = profs || [];
  }
  buildSidebar();
  renderPersona(viewingProfile);
}

function togglePwdPanel(){
  const panel = document.getElementById('pwd-panel');
  panel.classList.toggle('open');
  document.getElementById('pwd-new').value = '';
  document.getElementById('pwd-confirm').value = '';
  document.getElementById('pwd-msg').textContent = '';
}

async function changePassword(){
  const nueva = document.getElementById('pwd-new').value;
  const confirmar = document.getElementById('pwd-confirm').value;
  const msg = document.getElementById('pwd-msg');
  msg.className = 'pwd-msg';
  if(nueva.length < 6){ msg.textContent = 'Mínimo 6 caracteres.'; msg.classList.add('err'); return; }
  if(nueva !== confirmar){ msg.textContent = 'Las contraseñas no coinciden.'; msg.classList.add('err'); return; }
  const { error } = await sb.auth.updateUser({ password: nueva });
  if(error){ msg.textContent = 'No se pudo cambiar: ' + error.message; msg.classList.add('err'); }
  else { msg.textContent = 'Contraseña actualizada ✓'; msg.classList.add('ok'); setTimeout(togglePwdPanel, 1800); }
}

async function doLogout(){
  await sb.auth.signOut();
  myProfile = null; viewingProfile = null;
  document.getElementById('login').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('email-input').value='';
  document.getElementById('pass-input').value='';
}

function buildSidebar(){
  const sidebar = document.getElementById('sidebar');
  if(ES_DIRECTIVO(myProfile.rol)){
    sidebar.innerHTML = `<div class="label">Dirección</div>
      <button class="nav-item ${viewingProfile.id===myProfile.id?'active':''}" onclick="switchTo('${myProfile.id}')">${myProfile.nombre} (yo)</button>
      <div class="label" style="margin-top:22px;">Equipo</div>
      ${allProfiles.filter(p=>p.id!==myProfile.id).map(p=>`<button class="nav-item ${viewingProfile&&viewingProfile.id===p.id?'active':''}" onclick="switchTo('${p.id}')">${p.nombre} — ${ROL_LABEL[p.rol]}</button>`).join('')}
      <button class="nav-item" onclick="renderConsolidado()">Vista consolidada</button>`;
  } else {
    sidebar.innerHTML = `<div class="label">Mi panel</div><button class="nav-item active">Mis indicadores</button>`;
  }
}

function switchTo(id){
  viewingProfile = id===myProfile.id ? myProfile : allProfiles.find(p=>p.id===id);
  buildSidebar();
  renderPersona(viewingProfile);
}

function cambiarPeriodo(valorMes){
  // input type=month da "YYYY-MM" -> lo llevamos a "YYYY-MM-01"
  renderPersona(currentViewProfile, valorMes + '-01');
}

function applyFilters(){
  const marca = document.getElementById('filter-marca')?.value || '';
  const red = document.getElementById('filter-red')?.value || '';
  document.querySelectorAll('tr[data-marca]').forEach(tr=>{
    const okMarca = !marca || tr.dataset.marca === marca;
    const okRed = !red || tr.dataset.red === red;
    tr.style.display = (okMarca && okRed) ? '' : 'none';
  });
}

function pill(tipo){ return `<span class="pill ${tipo==='cuantitativo'?'cuanti':'cuali'}">${tipo==='cuantitativo'?'Cuantitativo':'Cualitativo'}</span>`; }

async function renderPersona(profile, periodoOverride){
  document.getElementById('main').innerHTML = '<div class="loading">Cargando indicadores…</div>';
  const periodo = periodoOverride || currentPeriodo();
  const puedeCargarCuanti = myProfile.id === profile.id || ES_DIRECTIVO(myProfile.rol);
  const puedeCargarCuali = ES_DIRECTIVO(myProfile.rol);

  const { data: indicadores } = await sb.from('indicadores').select('*').eq('persona_rol', profile.rol).order('marca').order('nombre');
  const { data: valores } = await sb.from('valores_cuantitativos').select('*').eq('persona_id', profile.id).eq('periodo', periodo);
  const { data: evals } = await sb.from('evaluaciones_cualitativas').select('*').eq('persona_id', profile.id).eq('periodo', periodo);

  const valMap = Object.fromEntries((valores||[]).map(v=>[v.indicador_id, v]));
  const evalMap = Object.fromEntries((evals||[]).map(v=>[v.indicador_id, v]));

  const cuanti = (indicadores||[]).filter(i=>i.tipo==='cuantitativo');
  const cuali = (indicadores||[]).filter(i=>i.tipo==='cualitativo');
  const marcasUnicas = [...new Set(cuanti.filter(i=>i.red_social).map(i=>i.marca).filter(Boolean))];
  currentCuanti = cuanti;
  currentViewProfile = profile;
  currentPeriodoStr = periodo;
  currentPuedeCargarCuanti = puedeCargarCuanti;

  document.getElementById('main').innerHTML = `
    <div class="page-head">
      <div><h1>${profile.nombre}</h1><div class="sub">${ROL_LABEL[profile.rol]}</div></div>
      <div class="period">Período: <input type="month" id="periodo-select" value="${periodo.slice(0,7)}" onchange="cambiarPeriodo(this.value)" style="font-family:'Roboto Mono';font-size:12px;border:1px solid var(--line);padding:3px 6px;"></div>
    </div>
    <div class="section-title"><span class="num">01</span> Indicadores cuantitativos
      ${puedeCargarCuanti ? `<span style="margin-left:auto;display:flex;gap:8px;align-items:center;">
        ${marcasUnicas.length ? `<select id="pdf-marca-select">${marcasUnicas.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>` : ''}
        <button class="savebtn" onclick="downloadTemplate()">Descargar plantilla CSV</button>
        ${marcasUnicas.length ? `<label class="savebtn" style="cursor:pointer;">Generar CSV desde PDF Metricool<input type="file" accept=".pdf" style="display:none" onchange="parsePdfAndBuildCsv(event)"></label>` : ''}
        <label class="savebtn" style="cursor:pointer;">Importar CSV<input type="file" accept=".csv" style="display:none" onchange="importCSV(event)"></label>
      </span>` : ''}
    </div>
    <div class="pwd-msg" id="import-msg" style="margin-bottom:10px;"></div>
    ${marcasUnicas.length ? `<div class="filters">
      <select id="filter-marca" onchange="applyFilters()"><option value="">Todas las marcas</option>${marcasUnicas.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
      <select id="filter-red" onchange="applyFilters()"><option value="">Todas las redes</option>${[...new Set(cuanti.filter(i=>i.red_social).map(i=>i.red_social))].map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
    </div>` : ''}
    <table>
      <tr><th>Indicador</th><th>Marca / Red</th><th style="width:170px;">Valor</th><th>Objetivo</th></tr>
      ${cuanti.length ? cuanti.map(i=>{
        const v = valMap[i.id];
        const disabled = puedeCargarCuanti ? '' : 'disabled';
        return `<tr data-marca="${i.marca||''}" data-red="${i.red_social||''}">
          <td>${i.nombre}<div class="tagmini">${i.frecuencia||''} · ${i.fuente_datos||''}</div></td>
          <td class="tagmini">${[i.marca,i.red_social].filter(Boolean).join(' · ') || '—'}</td>
          <td><input class="valinput" id="v-${i.id}" type="number" step="any" value="${v?v.valor:''}" ${disabled}>
              ${puedeCargarCuanti?`<button class="savebtn" onclick="saveValor(${i.id}, '${profile.id}')">Guardar</button>`:''}</td>
          <td class="mono">${v&&v.objetivo!=null?v.objetivo:'—'}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="4" class="empty">No hay indicadores cuantitativos cargados en el catálogo para este rol.</td></tr>`}
    </table>
    <div class="section-title"><span class="num">02</span> Evaluación cualitativa</div>
    <table>
      <tr><th>Criterio</th><th style="width:170px;">Puntaje (0-100)</th><th>Comentario</th></tr>
      ${cuali.length ? cuali.map(i=>{
        const v = evalMap[i.id];
        const disabled = puedeCargarCuali ? '' : 'disabled';
        return `<tr>
          <td>${i.nombre}</td>
          <td><input class="valinput" id="s-${i.id}" type="number" min="0" max="100" value="${v?v.puntaje:''}" ${disabled}>
              ${puedeCargarCuali?`<button class="savebtn" onclick="saveEval(${i.id}, '${profile.id}')">Guardar</button>`:''}</td>
          <td><input class="valinput" style="width:100%" id="c-${i.id}" type="text" value="${v&&v.comentario?v.comentario.replace(/"/g,'&quot;'):''}" ${disabled} placeholder="Comentario opcional"></td>
        </tr>`;
      }).join('') : `<tr><td colspan="3" class="empty">No hay indicadores cualitativos cargados en el catálogo para este rol.</td></tr>`}
    </table>
    <div class="section-title"><span class="num">03</span> Evolución mensual
      <button class="savebtn" style="margin-left:auto;" onclick="toggleEvolucion()">Ver últimos 12 meses</button>
    </div>
    <div id="evolucion-container"></div>
  `;
}

function ultimos12Periodos(){
  const out = [];
  const d = new Date();
  d.setDate(1);
  for(let i=0;i<12;i++){
    out.unshift(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`);
    d.setMonth(d.getMonth()-1);
  }
  return out;
}

let evolucionAbierta = false;
async function toggleEvolucion(){
  const cont = document.getElementById('evolucion-container');
  evolucionAbierta = !evolucionAbierta;
  if(!evolucionAbierta){ cont.innerHTML = ''; return; }
  cont.innerHTML = '<div class="loading">Cargando evolución…</div>';
  const periodos = ultimos12Periodos();
  const ids = currentCuanti.map(i=>i.id);
  const { data: valores } = await sb.from('valores_cuantitativos').select('*')
    .eq('persona_id', currentViewProfile.id).in('indicador_id', ids)
    .gte('periodo', periodos[0]);
  const map = {};
  (valores||[]).forEach(v=>{
    map[`${v.indicador_id}_${v.periodo}`] = v.valor;
  });
  const rows = currentCuanti.map(i=>{
    const cells = periodos.map(p=>{
      const v = map[`${i.id}_${p}`];
      return `<td class="mono" style="text-align:right;">${v!==undefined && v!==null ? v : '—'}</td>`;
    }).join('');
    return `<tr data-marca="${i.marca||''}" data-red="${i.red_social||''}">
      <td>${i.nombre}<div class="tagmini">${[i.marca,i.red_social].filter(Boolean).join(' · ')}</div></td>
      ${cells}
    </tr>`;
  }).join('');
  const headers = periodos.map(p=>`<th style="text-align:right;">${p.slice(0,7)}</th>`).join('');
  cont.innerHTML = `<table><tr><th>Indicador</th>${headers}</tr>${rows}</table>`;
  applyFilters();
}

async function saveValor(indicadorId, personaId){
  const valor = document.getElementById(`v-${indicadorId}`).value;
  const btn = event.target;
  const { error } = await sb.from('valores_cuantitativos').upsert({
    indicador_id: indicadorId, persona_id: personaId, periodo: currentPeriodo(),
    valor: valor === '' ? null : Number(valor), cargado_por: myProfile.id
  }, { onConflict: 'indicador_id,persona_id,periodo' });
  if(!error){ btn.textContent='Guardado ✓'; btn.classList.add('saved'); setTimeout(()=>{btn.textContent='Guardar'; btn.classList.remove('saved');}, 1500); }
  else { alert('No se pudo guardar: ' + error.message); }
}

async function saveEval(indicadorId, personaId){
  const puntaje = document.getElementById(`s-${indicadorId}`).value;
  const comentario = document.getElementById(`c-${indicadorId}`).value;
  const btn = event.target;
  const { error } = await sb.from('evaluaciones_cualitativas').upsert({
    indicador_id: indicadorId, persona_id: personaId, periodo: currentPeriodo(),
    puntaje: puntaje === '' ? null : Number(puntaje), comentario, evaluado_por: myProfile.id
  }, { onConflict: 'indicador_id,persona_id,periodo' });
  if(!error){ btn.textContent='Guardado ✓'; btn.classList.add('saved'); setTimeout(()=>{btn.textContent='Guardar'; btn.classList.remove('saved');}, 1500); }
  else { alert('No se pudo guardar: ' + error.message); }
}

async function renderConsolidado(){
  document.getElementById('main').innerHTML = '<div class="loading">Cargando…</div>';
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h1>Vista Consolidada</h1><div class="sub">Equipo de marketing</div></div></div>
    <div class="team-grid">
      ${allProfiles.map(p=>`<div class="person-card" onclick="switchTo('${p.id}')"><div class="role">${ROL_LABEL[p.rol]}</div><div class="name">${p.nombre}</div></div>`).join('')}
    </div>
    <p class="empty">Hacé clic en una persona para ver su detalle.</p>
  `;
}

// Si ya había una sesión activa (recargó la página), la retoma.
sb.auth.getSession().then(({data})=>{
  if(data.session) afterLogin(data.session.user);
});
</script>
